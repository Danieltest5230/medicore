version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: medicore_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: medicore_db
      POSTGRES_USER: medicore_user
      POSTGRES_PASSWORD: medicore_password_secure_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medicore_user -d medicore_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: medicore_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: medicore_backend
    restart: unless-stopped
    environment:
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: "medicore-production-secure-key-2026-clinica-medica"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,backend"
      DB_ENGINE: "postgres"
      DB_NAME: "medicore_db"
      DB_USER: "medicore_user"
      DB_PASSWORD: "medicore_password_secure_2026"
      DB_HOST: "db"
      DB_PORT: "5432"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - medicore_media:/app/media

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    container_name: medicore_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  medicore_media:
