databases:
  - name: medicore-db
    databaseName: medicore_db
    user: medicore_user
    plan: free

services:
  - type: web
    name: medicore
    runtime: python
    plan: free
    buildCommand: "bash render_build.sh"
    startCommand: "cd backend && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: "*"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "True"
      - key: DATABASE_URL
        fromDatabase:
          name: medicore-db
          property: connectionString
