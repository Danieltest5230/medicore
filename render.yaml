services:
  # 1. Base de Datos PostgreSQL
  - type: postgres
    name: medicore-db
    databaseName: medicore_db
    user: medicore_user
    plan: free

  # 2. Servidor Backend Django REST
  - type: web
    name: medicore-backend
    env: python
    buildCommand: "cd backend && pip install -r requirements.txt gunicorn whitenoise && python manage.py migrate && python manage.py collectstatic --noinput"
    startCommand: "cd backend && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 3"
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: "*"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "True"
      - key: DATABASE_URL
        fromDatabase:
          name: medicore-db
          property: connectionString

  # 3. Frontend Web React + Vite
  - type: web
    name: medicore-frontend
    env: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
