name: Compilar APK Android MEDICORE

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Clonar Repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17 (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar Dependencias Frontend
        working-directory: frontend
        run: npm ci

      - name: Compilar Frontend React + Vite
        working-directory: frontend
        run: npm run build

      - name: Sincronizar Capacitor Android
        working-directory: frontend
        run: npx cap sync android

      - name: Dar permisos de ejecución a Gradlew
        working-directory: frontend/android
        run: chmod +x gradlew

      - name: Compilar APK Android (Debug - Instalable)
        working-directory: frontend/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Preparar archivo APK
        run: |
          mkdir -p build-output
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk build-output/MEDICORE-App-v1.0.apk

      - name: Publicar APK como Artefacto Descargable en GitHub
        uses: actions/upload-artifact@v4
        with:
          name: MEDICORE-App-Android-v1.0
          path: build-output/MEDICORE-App-v1.0.apk
          retention-days: 30
